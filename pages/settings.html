<h1 class="page-title" data-i18n="set.title">System Settings</h1>

<div class="card mb-20">
    <h3 class="mb-20" style="font-size:1.1rem; font-weight:700;" data-i18n="set.officer">Officer Information</h3>
    <div class="detail-row">
        <span class="detail-label" data-i18n="set.name">Name</span>
        <span class="detail-value" id="settings-officer-name">-</span>
    </div>
    <div class="detail-row">
        <span class="detail-label" data-i18n="set.email">Email</span>
        <span class="detail-value" id="settings-officer-email">-</span>
    </div>
    <div class="detail-row" style="border-bottom:none; margin-bottom:0; padding-bottom:0;">
        <span class="detail-label" data-i18n="set.role">Role</span>
        <span class="detail-value" id="settings-officer-role">-</span>
    </div>
</div>

<div class="card mb-20">
    <h3 class="mb-20" style="font-size:1.1rem; font-weight:700;" data-i18n="set.prefs">Preferences</h3>
    <div class="detail-row" style="align-items:center;">
        <span class="detail-label" data-i18n="set.language">Language</span>
        <div class="lang-switch" role="group" data-i18n-aria="set.language">
            <button type="button" data-set-lang="en">EN</button>
            <button type="button" data-set-lang="th">TH</button>
        </div>
    </div>
    <div class="detail-row" style="align-items:center;">
        <div>
            <div class="detail-label" data-i18n="set.sound">Alert Sound</div>
            <div class="setting-hint" data-i18n="set.soundDesc"></div>
        </div>
        <label class="switch-row">
            <span class="detail-value" id="settings-sound-status"></span>
            <input type="checkbox" id="settings-sound">
            <span class="switch" aria-hidden="true"></span>
        </label>
    </div>
    <div class="detail-row" style="border-bottom:none; margin-bottom:0; padding-bottom:0;">
        <span class="detail-label" data-i18n="set.demoMode">Demo Mode</span>
        <span class="detail-value" id="settings-demo-status">-</span>
    </div>
</div>

<div class="card mb-20">
    <h3 class="mb-20" style="font-size:1.1rem; font-weight:700;" data-i18n="set.data">Data Management</h3>
    <p class="mb-20" style="color: var(--text-secondary);" data-i18n="set.dataDesc"></p>
    <button class="btn btn-danger" id="btn-reset-data" data-i18n="set.reset">Reset Demo Data</button>
    <p class="setting-hint" id="settings-admin-note" style="margin-top:10px;" data-i18n="set.adminOnly"></p>
</div>

<div class="card mb-20">
    <h3 class="mb-20" style="font-size:1.1rem; font-weight:700;" data-i18n="set.system">System Info</h3>
    <div class="detail-row">
        <span class="detail-label" data-i18n="set.version">Version</span>
        <span class="detail-value" data-i18n="set.versionValue"></span>
    </div>
    <div class="detail-row">
        <span class="detail-label" data-i18n="set.storage">Storage</span>
        <span class="detail-value">localStorage</span>
    </div>
    <div class="detail-row">
        <span class="detail-label" data-i18n="set.auth">Authentication</span>
        <span class="detail-value" data-i18n="set.authValue"></span>
    </div>
    <div class="detail-row" style="border-bottom:none; margin-bottom:0; padding-bottom:0;">
        <span class="detail-label" data-i18n="set.theme">UI Theme</span>
        <span class="detail-value" style="color:var(--primary-color);" data-i18n="set.themeValue"></span>
    </div>
</div>

<div class="card">
    <h3 class="mb-20" style="font-size:1.1rem; font-weight:700;" data-i18n="set.session">Session</h3>
    <p class="mb-20" style="color: var(--text-secondary);" data-i18n="set.sessionDesc"></p>
    <button class="btn btn-secondary" id="btn-logout">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        <span data-i18n="set.logout">Logout</span>
    </button>
</div>
