<div class="section-caption">
    <span data-i18n="dash.today">Today</span> · <span id="dash-today-date"></span>
</div>

<!-- Today's count per incident type (rendered by js/dashboard.js) -->
<div class="grid-cards grid-cards-compact" id="dash-type-cards"></div>

<div class="card status-strip mb-20">
    <div class="status-strip-item">
        <span class="ss-icon" style="background-color: #fef3c7; color: #b45309;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        </span>
        <div>
            <div class="ss-label" data-i18n="dash.new">New Events</div>
            <div class="ss-value" id="dash-stat-new">0</div>
        </div>
    </div>
    <div class="status-strip-item">
        <span class="ss-icon" style="background-color: #dbeafe; color: #1d4ed8;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <div>
            <div class="ss-label" data-i18n="dash.reviewing">Under Review</div>
            <div class="ss-value" id="dash-stat-reviewing">0</div>
        </div>
    </div>
    <div class="status-strip-item">
        <span class="ss-icon" style="background-color: #dcfce7; color: #15803d;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        <div>
            <div class="ss-label" data-i18n="dash.actionTaken">Action Taken</div>
            <div class="ss-value" id="dash-stat-actiontaken">0</div>
        </div>
    </div>
    <div class="status-strip-item">
        <span class="ss-icon" style="background-color: var(--success-light); color: var(--success-color);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>
        </span>
        <div>
            <div class="ss-label" data-i18n="dash.cameras">Cameras Online</div>
            <div class="ss-value" id="dash-stat-cameras">0/0</div>
        </div>
    </div>
</div>

<div class="flex-between toolbar-row mb-20">
    <h2 style="font-size: 1.2rem;" data-i18n="dash.recent">Recent Alerts</h2>
    <div class="toolbar">
        <button class="btn btn-secondary btn-sm" onclick="navTo('camera')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>
            <span data-i18n="dash.openCamera">Open Camera</span>
        </button>
        <button class="btn btn-secondary btn-sm" onclick="navTo('alerts')" data-i18n="dash.viewAlerts">View Open Alerts</button>
        <button class="btn btn-secondary btn-sm" onclick="navTo('map')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
            <span data-i18n="dash.viewMap">View Risk Map</span>
        </button>
    </div>
</div>

<div class="incident-detail-container mb-20">
    <div class="detail-main" style="flex: 2;">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th data-i18n="col.id">ID</th>
                        <th data-i18n="col.dateTime">Date / Time</th>
                        <th data-i18n="col.type">Type</th>
                        <th data-i18n="col.location">Location</th>
                        <th data-i18n="col.status">Status</th>
                        <th data-i18n="col.action">Action</th>
                    </tr>
                </thead>
                <tbody id="dash-alerts-table">
                    <!-- Injected -->
                </tbody>
            </table>
        </div>
    </div>
    <div class="detail-sidebar" style="flex: 1;">
        <div class="card">
            <div class="flex-between mb-20">
                <h3 style="font-size: 1.05rem; display:flex; align-items:center; gap:8px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--danger-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                    <span data-i18n="dash.topRisk">Top Risk Locations</span>
                </h3>
                <button class="btn btn-sm btn-secondary" onclick="navTo('map')" data-i18n="common.map">Map</button>
            </div>
            <div id="dash-hotspots"><!-- Injected --></div>
        </div>
    </div>
</div>
