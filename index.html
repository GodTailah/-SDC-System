<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART DRIVE CAMPUS</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- SIDEBAR OVERLAY (For Mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- LOGIN SCREEN (simulated auth, see js/auth.js) -->
    <div class="login-screen" id="login-screen">
        <div class="login-card" id="login-card">
            <div class="login-header">
                <div class="login-brand">
                    <span class="logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </span>
                    <div>
                        <div class="login-brand-name">SMART DRIVE CAMPUS</div>
                        <div class="login-brand-sub">SDC System</div>
                    </div>
                </div>
                <div class="lang-switch" role="group" data-i18n-aria="lang.switch">
                    <button type="button" data-set-lang="en">EN</button>
                    <button type="button" data-set-lang="th">TH</button>
                </div>
            </div>

            <h1 class="login-title" data-i18n="login.title">Sign in</h1>
            <p class="login-subtitle" data-i18n="login.subtitle"></p>

            <div class="login-notice" id="login-notice"></div>
            <div class="login-error" id="login-error" role="alert"></div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-email" data-i18n="login.email">Email</label>
                    <input type="email" id="login-email" class="form-input" placeholder="name@sdc-demo.ac.th"
                        autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password" data-i18n="login.password">Password</label>
                    <div class="password-field">
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••"
                            autocomplete="current-password">
                        <button type="button" class="password-toggle" id="login-password-toggle"
                            data-i18n-aria="login.showPassword">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" id="login-remember"> <span data-i18n="login.remember"></span>
                </label>
                <button type="submit" class="btn btn-primary btn-block" id="login-submit" data-i18n="login.submit">Log In</button>
            </form>

            <div class="demo-accounts">
                <div class="demo-accounts-title" data-i18n="login.demoAccounts"></div>
                <div id="demo-accounts-list"><!-- Injected --></div>
            </div>

            <p class="login-footnote" data-i18n="login.footnote"></p>
        </div>
    </div>

    <!-- SIDEBAR (starts collapsed; js/navigation.js expands it on desktop) -->
    <aside class="sidebar collapsed" id="main-sidebar">
        <div class="sidebar-header">
            <div class="brand-info">
                <span class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </span>
                <span>SDC System</span>
            </div>
            <button class="sidebar-toggle-btn" id="sidebar-toggle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
            </button>
        </div>
        <div class="nav-links">
            <a href="#" class="nav-item active" data-page="dashboard" data-i18n-title="nav.dashboard">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                <span class="nav-label" data-i18n="nav.dashboard">Dashboard</span>
            </a>
            <a href="#" class="nav-item" data-page="camera" data-i18n-title="nav.camera">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>
                <span class="nav-label" data-i18n="nav.camera">Camera Monitor</span>
            </a>
            <a href="#" class="nav-item" data-page="alerts" data-i18n-title="nav.alerts">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <span class="nav-label" data-i18n="nav.alerts">Alert Center</span>
            </a>
            <a href="#" class="nav-item" data-page="incidents" data-i18n-title="nav.incidents">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>
                <span class="nav-label" data-i18n="nav.incidents">Incidents</span>
            </a>
            <a href="#" class="nav-item" data-page="map" data-i18n-title="nav.map">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
                <span class="nav-label" data-i18n="nav.map">Risk Map</span>
            </a>
            <a href="#" class="nav-item" data-page="stats" data-i18n-title="nav.stats">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
                <span class="nav-label" data-i18n="nav.stats">Statistics</span>
            </a>
            <a href="#" class="nav-item" data-page="settings" data-i18n-title="nav.settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                <span class="nav-label" data-i18n="nav.settings">Settings</span>
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-left">
                <!-- Mobile only: the sidebar is off-screen, so it needs an opener here -->
                <button class="sidebar-toggle-btn mobile-only" id="sidebar-open" data-i18n-title="sidebar.open"
                    data-i18n-aria="sidebar.open">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                </button>
                <h2 id="topbar-title"></h2>
            </div>
            <div class="topbar-right">
                <button class="demo-toggle-btn" id="demo-toggle" data-i18n-title="topbar.demoMode">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><circle cx="15" cy="13" r="1"/><circle cx="18" cy="11" r="1"/><rect width="20" height="12" x="2" y="6" rx="6"/></svg>
                    <span class="demo-label" data-i18n="topbar.demoMode">DEMO MODE</span>
                </button>

                <div class="lang-switch" role="group" data-i18n-aria="lang.switch">
                    <button type="button" data-set-lang="en">EN</button>
                    <button type="button" data-set-lang="th">TH</button>
                </div>

                <div class="notification-wrapper" id="notif-wrapper">
                    <button type="button" class="notification-icon" id="notif-bell" data-i18n-aria="notif.title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                    </button>
                    <span class="badge" id="notif-badge">0</span>

                    <div class="notification-dropdown">
                        <div class="dropdown-header">
                            <span data-i18n="notif.title">Notifications</span>
                            <button class="btn btn-sm btn-secondary" id="clear-notifs" data-i18n="notif.clear">Clear</button>
                        </div>
                        <div id="notif-list">
                            <!-- Notifications injected here -->
                        </div>
                    </div>
                </div>

                <div class="officer-profile">
                    <div class="avatar" id="officer-avatar">CM</div>
                    <span class="officer-name" id="officer-name">Chompoonuch</span>
                </div>
            </div>
        </header>

        <!-- PAGE: DASHBOARD -->
        <div class="page-container active" id="page-dashboard"></div>

        <!-- PAGE: CAMERA MONITOR -->
        <div class="page-container" id="page-camera"></div>

        <!-- PAGE: ALERT CENTER -->
        <div class="page-container" id="page-alerts"></div>

        <!-- PAGE: INCIDENTS (LIST & DETAIL) -->
        <div class="page-container" id="page-incidents"></div>

        <!-- PAGE: RISK MAP -->
        <div class="page-container" id="page-map"></div>

        <!-- PAGE: STATISTICS -->
        <div class="page-container" id="page-stats"></div>

        <!-- PAGE: SETTINGS -->
        <div class="page-container" id="page-settings"></div>

        <!-- FOOTER -->
        <footer class="footer" data-i18n="footer.text"></footer>
    </main>

    <!-- FLOATING DEMO PANEL -->
    <div class="demo-panel" id="demo-panel">
        <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><circle cx="15" cy="13" r="1"/><circle cx="18" cy="11" r="1"/><rect width="20" height="12" x="2" y="6" rx="6"/></svg>
            <span data-i18n="demo.title">Simulation Controls</span>
        </h3>
        <p class="demo-desc" data-i18n="demo.desc"></p>
        <div class="demo-auto">
            <label class="switch-row">
                <input type="checkbox" id="demo-auto-toggle">
                <span class="switch" aria-hidden="true"></span>
                <span data-i18n="demo.auto">Auto-generate events</span>
            </label>
            <select class="search-bar select-sm" id="demo-auto-interval"></select>
        </div>
        <div class="demo-buttons" id="demo-buttons"><!-- Injected --></div>
    </div>

    <!-- Alert beep is generated with the Web Audio API (js/utils.js) -->

    <!-- JAVASCRIPT -->
    <script src="js/data.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/incidents.js"></script>
    <script src="js/map.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
